[workspace]
resolver = "2"
members = [
    "crates/peel-core",
    "crates/peel-ffi",
    "crates/peel-cli",
]
default-members = ["crates/peel-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Snack Studio <hello@snackstud.io>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
bzip2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
