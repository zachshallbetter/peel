name: Peel
options:
  bundleIdPrefix: io.snackstud
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  PeelKit:
    path: ../swift/PeelKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    PRODUCT_NAME: Peel
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_HARDENED_RUNTIME: NO
    COMBINE_HIDPI_IMAGES: YES

targets:
  Peel:
    type: application
    platform: macOS
    sources:
      - path: Peel
    dependencies:
      - package: PeelKit
        product: PeelKit
      - target: PeelFSExtension
        embed: true
      - target: PeelQLPreview
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.snackstud.peel
        INFOPLIST_FILE: Peel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Peel/Peel.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../Helpers"
    postBuildScripts:
      - name: Embed peel engine
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          HELPERS="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          mkdir -p "${HELPERS}"
          ENGINE="${SRCROOT}/../target/release/peel"
          test -x "${ENGINE}"
          cp -f "${ENGINE}" "${HELPERS}/peel"
          chmod +x "${HELPERS}/peel"
          RES="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${RES}"
          cp -f "${ENGINE}" "${RES}/peel"
          chmod +x "${RES}/peel"
          echo "Embedded peel engine"

  PeelFSExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: PeelFSExtension
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.snackstud.peel.PeelFS
        PRODUCT_NAME: PeelFSExtension
        INFOPLIST_FILE: PeelFSExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PeelFSExtension/PeelFSExtension.entitlements
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        SKIP_INSTALL: YES
        PRODUCT_MODULE_NAME: PeelFSExtension
    dependencies:
      - sdk: FSKit.framework

  # FND-001: Space on ZIP → bounded entry list (scaffold; later peel XPC).
  PeelQLPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: PeelQLPreview
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.snackstud.peel.QuickLook
        PRODUCT_NAME: PeelQLPreview
        INFOPLIST_FILE: PeelQLPreview/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PeelQLPreview/PeelQLPreview.entitlements
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        SKIP_INSTALL: YES
        PRODUCT_MODULE_NAME: PeelQLPreview
