name: Peel
options:
  bundleIdPrefix: dev.shallbetter
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  PeelKit:
    path: ../swift/PeelKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    PRODUCT_NAME: Peel
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    COMBINE_HIDPI_IMAGES: YES

targets:
  Peel:
    type: application
    platform: macOS
    sources:
      - path: Peel
    dependencies:
      - package: PeelKit
        product: PeelKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shallbetter.peel
        INFOPLIST_FILE: Peel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../Helpers"
    postBuildScripts:
      - name: Embed peel engine
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          HELPERS="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          mkdir -p "${HELPERS}"
          ENGINE="${SRCROOT}/../target/release/peel"
          test -x "${ENGINE}"
          cp -f "${ENGINE}" "${HELPERS}/peel"
          chmod +x "${HELPERS}/peel"
          RES="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${RES}"
          cp -f "${ENGINE}" "${RES}/peel"
          chmod +x "${RES}/peel"
          echo "Embedded peel engine"
