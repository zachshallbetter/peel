name: Feature request
description: Propose a change to Peel's scope, requirements or roadmap.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        Peel's documents are requirements. Say which document or requirement your idea changes.
  - type: textarea
    id: problem
    attributes:
      label: The behavior you want
      description: What should Peel do? What is the use case?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
      description: A command, an option, an API, or a change to the docs.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
